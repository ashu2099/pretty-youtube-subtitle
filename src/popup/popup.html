<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Subtitle Styler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <h1 class="panel-title">Subtitle Styler</h1>
    </header>

    <section class="preview-section" aria-label="Subtitle Preview">
      <div class="video-mock">
        <span id="preview-caption" class="caption-sample">Sample YouTube Subtitle</span>
      </div>
    </section>

    <form id="styler-form" class="styler-form" onsubmit="return false;">
      <div class="field-group">
        <label for="fontSize" class="field-label">Font Size</label>
        <div class="input-with-unit">
          <input type="number" id="fontSize" class="number-input" min="8" max="72" step="1" value="22">
          <span class="unit-badge">px</span>
        </div>
      </div>

      <div class="field-group">
        <div class="label-row">
          <label for="fontColor" class="field-label">Font Color</label>
          <a href="https://colorpicker.me" target="_blank" rel="noopener noreferrer" class="helper-link">Color Picker</a>
        </div>
        <input type="text" id="fontColor" class="text-input" placeholder="e.g. #ffffff or yellow" autocomplete="off">
      </div>

      <div class="field-group">
        <label for="bgColor" class="field-label">Background Color</label>
        <input type="text" id="bgColor" class="text-input" placeholder="e.g. #000000 or black" autocomplete="off">
      </div>

      <div class="field-group">
        <label for="bgOpacity" class="field-label">Background Opacity (0.1 - 1.0)</label>
        <input type="number" id="bgOpacity" class="text-input" min="0" max="1" step="0.05" placeholder="0.1 - 1.0" value="0.75">
      </div>

      <div class="field-row">
        <div class="field-group half-width">
          <label for="textStroke" class="field-label">Text Stroke</label>
          <select id="textStroke" class="select-input">
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>

        <div class="field-group half-width">
          <label for="textShadow" class="field-label">Text Shadow</label>
          <select id="textShadow" class="select-input">
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>
      </div>

      <footer class="form-footer">
        <button type="button" id="resetBtn" class="reset-button">Reset Defaults</button>
      </footer>
    </form>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
